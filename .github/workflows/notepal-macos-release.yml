name: Build and Release NotePal macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          cd NotePal
          APP_VERSION="${GITHUB_REF_NAME#v}" Scripts/build_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotePal-mac
          path: NotePal/build/NotePal-mac-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ZIP_PATH="$(ls NotePal/build/NotePal-mac-*.zip | head -n 1)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "NotePal ${TAG#v}" \
              --notes-file CHANGELOG.md \
              --prerelease
          gh release edit "$TAG" \
            --title "NotePal ${TAG#v}" \
            --notes-file CHANGELOG.md \
            --prerelease
          gh release upload "$TAG" "$ZIP_PATH" --clobber
